<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Plain fixture</title>
  <!-- No @page rules: the PDF options of each engine control the page. -->
  <style>
    body { margin: 0; font-family: sans-serif; font-size: 12px; }
    .bar { height: 40mm; background: rgb(200, 0, 0); }
    .ruler { width: 400px; }
    .right { float: right; }
    @media print { .screen-only { display: none; } }
    @media screen { .print-only { display: none; } }
  </style>
</head>
<body>
  <p>TOPLEFT</p>
  <div class="bar"></div>
  <div class="ruler"><span>LEFTMARK</span><span class="right">RIGHTMARK</span></div>
  <p class="screen-only">SCREENTEXT</p>
  <p class="print-only">PRINTTEXT</p>
  <h1>Heading one</h1>
  <h2>Heading two</h2>
</body>
</html>
