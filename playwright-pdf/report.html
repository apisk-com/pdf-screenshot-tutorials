<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Monthly usage report</title>
  <style>
    body { font: 12px/1.5 Arial, Helvetica, sans-serif; color: #1f2933; margin: 0; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 18px 0 8px; }
    .cover { background: #0b1016; color: #f2f6fa; padding: 24px; border-radius: 8px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
    .card { background: #e6fff2; border: 1px solid #99ffcc; border-radius: 6px; padding: 10px; }
    .card b { display: block; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 5px 8px; border-bottom: 1px solid #d9e2ec; text-align: left; }
    th { background: #d9e2ec; }
    tr { break-inside: avoid; }          /* never split a row over two pages */
    .new-page { break-before: page; }    /* start this section on a new page */
    .screen-only { background: #fff3c4; padding: 8px; margin-bottom: 12px; }
    @media print { .screen-only { display: none; } }
  </style>
</head>
<body>
  <p class="screen-only">Screen version: print media hides this note.</p>
  <section class="cover">
    <h1>Monthly usage report</h1>
    <p>Demo account, sample data generated by the script in this page.</p>
  </section>
  <div class="cards">
    <div class="card">Requests <b id="total">0</b></div>
    <div class="card">Errors <b id="errors">0</b></div>
    <div class="card">Days <b>30</b></div>
  </div>
  <h2>Requests per day</h2>
  <table>
    <thead><tr><th>Day</th><th>Requests</th><th>Errors</th><th>Error rate</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <section class="new-page">
    <h2>Notes</h2>
    <p>This section starts on a new page because of <code>break-before: page</code>.</p>
  </section>
  <script>
    // JavaScript runs before page.pdf(), so the PDF shows the finished table.
    let total = 0, errors = 0;
    for (let day = 1; day <= 30; day++) {
      const requests = 1000 + (day * 137) % 500;
      const failed = (day * 7) % 13;
      total += requests; errors += failed;
      document.getElementById('rows').insertAdjacentHTML('beforeend',
        `<tr><td>${day}</td><td>${requests}</td><td>${failed}</td><td>${(failed / requests * 100).toFixed(2)}%</td></tr>`);
    }
    document.getElementById('total').textContent = total;
    document.getElementById('errors').textContent = errors;
  </script>
</body>
</html>
